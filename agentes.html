<!doctype html>
<html lang="en">
<head>
<script src="demo.js?v=07f27daf"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your agents · demo</title>

<style>
@font-face{font-family:'Geist Mono';font-weight:400;src:url(vendor/geist-mono-400.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:500;src:url(vendor/geist-mono-500.woff2) format('woff2')}
  :root{
    --bg:#0A0C0B; --panel:#0F1211; --line:#1E2522; --text:#D5DED9; --muted:#66756E;
    --mint:#5EE6B0; --red:#FF5A5A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  #stage canvas.dragging{cursor:grabbing}
  #stage canvas.pointing{cursor:pointer}
  .ui{position:fixed;pointer-events:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #header{top:16px;left:16px;color:var(--text);font-weight:500}
  #header .muted{color:var(--muted);font-weight:400}
  #header .bad{color:var(--red)}
  #legend{left:16px;bottom:16px;color:var(--muted);font-size:10px;line-height:1.6;max-width:calc(100% - 32px)}
  #legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  #legend .sep{margin:0 8px;color:#3A4440}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .island-label{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;text-align:center;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1.35}
  .island-label b{display:block;font-weight:500}
  .island-label span{color:var(--muted);font-size:9px}
  #hover{position:fixed;pointer-events:none;transform:translate(-50%,-100%);padding:4px 7px;
    background:var(--panel);border:1px solid var(--line);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;white-space:nowrap;display:none}
  #hover .r{color:var(--muted);margin-left:6px}
  #card{position:fixed;top:16px;right:16px;width:42ch;max-width:calc(100% - 32px);
    background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--c,#D5DED9);
    padding:14px 16px 16px;font-size:12px;line-height:1.5;display:none;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #card.open{display:block}
  #card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
  #card button{all:unset;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
  #card button:hover{color:var(--text)}
  #card h2{margin:8px 0 0;font-size:16px;font-weight:500;letter-spacing:.02em}
  #card .role{color:var(--muted);font-size:11px;margin-bottom:10px}
  #card dl{margin:0;border-top:1px solid var(--line)}
  #card dt{margin-top:9px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #card dd{margin:2px 0 0}
  #card .chip{display:inline-block;margin-top:12px;padding:3px 8px;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;border:1px solid currentColor}
  #card .chip.ok{color:var(--mint)}
  #card .chip.bad{color:var(--red)}
  #card .trust{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  #card .score{display:flex;align-items:baseline;gap:8px}
  #card .score b{font-size:30px;font-weight:400;color:var(--tc)}#card .score span{color:var(--muted)}
  #card .verdict{font-size:11px;color:var(--tc);margin:2px 0 8px}
  #card .crit{display:grid;gap:6px}
  #card .crit div{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:11px}
  #card .crit i{grid-column:1/-1;height:3px;background:#1A2420;position:relative}
  #card .crit i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--tc)}
  #card .crit small{grid-column:1/-1;color:var(--muted);font-size:10px}
  #card .flag{margin-top:8px;font-size:11px;color:#FF8A3D}
  #card{max-height:calc(100% - 32px);overflow:auto}
  
  :root{--amber:#FFB547}
  .name-label{position:absolute;transform:translate(-50%,6px);white-space:nowrap;font-size:9px;letter-spacing:.08em;
    color:var(--muted);text-transform:none;pointer-events:none;text-shadow:0 1px 2px #000}
  .name-label.bad{color:#FF8A87}.name-label.live{color:#AFC9BE}
  #needs{position:fixed;top:40px;left:16px;width:40ch;max-width:calc(100% - 32px);max-height:calc(100% - 140px);overflow:auto;
    font-size:11px;line-height:1.45;background:rgba(15,18,17,.92);border:1px solid var(--line);padding:10px 12px 8px;display:none}
  #needs.on{display:block}
  #needs h3{margin:0 0 6px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;cursor:pointer}
  #needs.min .row{display:none}
  #needs .row.ok{display:none}#needs.fixed .row.ok{display:block}#needs.min .row.ok{display:none}
  #needs .more{all:unset;cursor:pointer;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding-top:6px;display:block}
  .row{border-top:1px solid var(--line);padding:7px 0}
  .row b{font-weight:500;cursor:pointer}.row b:hover{text-decoration:underline}
  .row .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-left:6px}
  .row .q{color:var(--text);margin-top:3px}.row .m{color:var(--muted);margin-top:2px}
  .row.pablo .k{color:var(--amber)}.row.bad .k{color:var(--red)}.row.ok .k{color:var(--mint)}
  .act{all:unset;cursor:pointer;display:inline-block;margin:6px 6px 0 0;padding:3px 8px;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;border:1px solid currentColor;color:var(--text)}
  .act:hover{background:#1A2420}.act.amber{color:var(--amber)}
  #drawer{position:fixed;left:16px;right:16px;bottom:12px;background:rgba(15,18,17,.94);border:1px solid var(--line);font-size:11px}
  #drawer .tabs{display:flex;gap:16px;align-items:center;padding:7px 12px;cursor:pointer;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #drawer .tabs span.on{color:var(--text)}#drawer .tabs .latest{flex:1;text-transform:none;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #drawer .body{display:none;max-height:44vh;overflow:auto;padding:0 12px 10px;border-top:1px solid var(--line)}
  #drawer.open .body{display:block}
  .h{display:grid;grid-template-columns:11ch 9ch 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #161C19;line-height:1.45}
  .h .d{color:var(--muted)}.h .t{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
  .t.added{color:var(--mint)}.t.retired{color:var(--red)}.t.changed{color:#7FD1FF}.t.fixed{color:var(--amber)}.t.rule{color:#B49CFF}
  .tool{display:grid;grid-template-columns:24ch 1fr 22ch;gap:8px;padding:5px 0;border-bottom:1px solid #161C19}
  .tool .m{color:var(--muted)}
  #legend{bottom:52px}
  #card .act{border:1px solid currentColor;padding:3px 8px;margin:12px 6px 0 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);display:inline-block}
  #card .act.amber{color:var(--amber)}#card .act:hover{background:#1A2420}
  #card .runs{margin:2px 0 0;padding-left:14px;color:var(--muted);font-size:10px}
  #card .wrong{color:var(--amber)}
  @media (max-width:560px){
    #card{top:auto;bottom:56px;left:16px;right:16px;width:auto}
    #needs{width:auto;right:16px}
    .name-label{display:none!important}
    .h{grid-template-columns:9ch 1fr}.h .t{display:none}.tool{grid-template-columns:1fr}
  }
</style>

<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="header" class="ui"></div>

  <span class="dot" style="background:var(--mint)"></span>working

</div>

<div id="drawer"><div class="tabs" id="d-tabs"></div><div class="body" id="d-body"></div></div>

  <div class="top"><span id="c-orch"></span><button id="c-close" aria-label="Close">×</button></div>
  <h2 id="c-name"></h2>
  <div class="role" id="c-role"></div>
  <dl>
    <dt>Orchestrator</dt><dd id="c-o"></dd>

    <dt id="c-lastk">Last run</dt><dd id="c-last"></dd>

<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script>
 
const ORCHESTRATORS = [
  { key:'people',      id:'lider-personas',      color:'#7FD1FF', pos:[-5.4, 0.00,-5.0] },
  { key:'commitments', id:'lider-compromisos',   color:'#FF9E6B', pos:[ 5.4, 0.55,-5.4] },
  { key:'thinking',    id:'lider-pensamiento',   color:'#B49CFF', pos:[-5.4,-0.35, 5.4] },
  { key:'upkeep',      id:'lider-mantenimiento', color:'#9BE58A', pos:[ 5.0, 0.25, 5.4] },
  { key:'outside',     id:'',                    color:'#8A9690', pos:[ 0.3, 1.5,-0.9], name:'Outside any orchestrator',
    goal:'Agents that serve no orchestrator yet — each one says why.' },
];
let AG={agentes:[],orquestadores:[],problemas:[],atencion:{filas:{}},historia:[]}, TOOLS=[];
let AGENTS = [], CONF = {agentes:{}, orquestadores:{}};
const OKEY={personas:'people',compromisos:'commitments',pensamiento:'thinking',mantenimiento:'upkeep'};
function en(t){ return String(t||'').replace(/^hoy\b/,'today').replace(/^mañana\b/,'tomorrow').replace(/^ayer\b/,'yesterday').replace(/^hace (\d+) d[ií]as?/,'$1 days ago')
  .replace(/\blunes\b/,'Monday').replace(/\bmartes\b/,'Tuesday').replace(/\bmiércoles\b/,'Wednesday').replace(/\bjueves\b/,'Thursday').replace(/\bviernes\b/,'Friday').replace(/\bsábado\b/,'Saturday').replace(/\bdomingo\b/,'Sunday').replace(/^(\d{1,2}) (ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)\b/,(m,d,mo)=>({ene:'Jan',feb:'Feb',mar:'Mar',abr:'Apr',may:'May',jun:'Jun',jul:'Jul',ago:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dic:'Dec'}[mo])+' '+d).replace(/^falló$/,'failed'); }
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function trustHtml(ids,label,orchKey){
  const pairs=ids.map(id=>[id,CONF.agentes[id]]).filter(x=>x[1]); if(!pairs.length) return '';
  const one=pairs.length===1&&!orchKey?pairs[0][1]:null, oc=orchKey&&CONF.orquestadores[orchKey];
  const score=one?one.puntos:oc?oc.puntos:Math.round(pairs.reduce((a,x)=>a+x[1].puntos,0)/pairs.length);
  const tc=score>=85?'#5EE6B0':score>=60?'#D5DED9':'#FF5A5A';
  const verdict=(one&&one.veredicto)||(oc&&oc.veredicto)||(score>=85?'Trusted · it could stop asking you about the easy ones':score>=60?'Good · keep reviewing':'Needs fixing · the Architect should look at it');
  const crit=one?(one.criterios||[]).map(([n,v,d])=>`<div><span>${esc(n)}</span><span>${esc(d)}</span><i style="--w:${Math.round(v*100)}%"></i></div>`).join('')
                :pairs.map(([id,x])=>`<div><span>${esc(id)}</span><span>${x.puntos}/100</span><i style="--w:${x.puntos}%"></i></div>`).join('');
  const flag=one&&one.rapido&&one.segundos_promedio!=null?`<div class="flag">⚠ You decide these in ${one.segundos_promedio}s on average. Are you reading them?</div>`:'';
  return `<div style="--tc:${tc}"><dt style="margin:0 0 4px">Trust score · since ${esc(CONF.desde||'')}</dt><div class="score"><b>${score}</b><span>/ 100</span></div><div class="verdict">${esc(verdict)}</div>
    <dt style="margin:0 0 6px">${one?'Criteria':label}</dt><div class="crit">${crit}</div>${one&&one.nunca_pregunta?'<div class="flag" style="color:var(--muted)">It never asks you anything, so only reliability counts.</div>':''}${flag}</div>`;
}
function startWorld(){
if(!window.THREE){ document.getElementById('header').textContent='Could not load three.js'; return; }
const ORCH = Object.fromEntries(ORCHESTRATORS.map(o=>[o.key,o]));
const failingCount = AGENTS.filter(a=>a.status==='failing').length;
document.getElementById('header').innerHTML =
  `Your agents <span class="muted">·</span> ${AGENTS.length} <span class="muted">·</span> <span class="${failingCount?'bad':''}">${failingCount} not working</span>`;
 
const lerp=(a,b,s)=>a+(b-a)*s;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=s=>{s=clamp(s,0,1);return s*s*(3-2*s);};
const G={
  box:(w,h,d)=>new THREE.BoxGeometry(w,h,d),
  cyl:(rt,rb,h,s=8)=>new THREE.CylinderGeometry(rt,rb,h,s),
  sph:(r,w=8,h=6)=>new THREE.SphereGeometry(r,w,h),
  cone:(r,h,s=8)=>new THREE.ConeGeometry(r,h,s),
  tor:(r,t,rs=6,ts=12,arc=Math.PI*2)=>new THREE.TorusGeometry(r,t,rs,ts,arc),
};
const matCache={};
function std(color,extra){
  const k=color+(extra?JSON.stringify(extra):'');
  if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color,flatShading:true,roughness:.88,metalness:.04},extra||{}));
  return matCache[k];
}
function basic(color,opacity=1){return new THREE.MeshBasicMaterial({color,transparent:opacity<1,opacity,depthWrite:opacity>=1});}
function mix(a,b,t){return '#'+new THREE.Color(a).lerp(new THREE.Color(b),t).getHexString();}
function mk(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);return m;}
const M={
  body:std('#D5DED9'), limb:std('#9AA8A1'), dark:std('#2B3330'), paper:std('#E9EFEB'),
  steel:std('#7E8B85'), glass:std('#B7C4BD'),
  redBody:std('#EE8F8D'), redLimb:std('#D77976'),
  islandTop:std('#1A201E'), islandUnder:std('#111614'), rock:std('#232B28'),
};
const hitMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false});
 
function holderOf(arm,hand){const g=new THREE.Group();g.quaternion.copy(arm.quaternion).invert();hand.add(g);return g;}
function hold(ch,side,rx,rz){
  const arm=side==='L'?ch.armL:ch.armR, hand=side==='L'?ch.handL:ch.handR;
  arm.rotation.set(rx,0,rz===undefined?arm.rotation.z:rz);
  return holderOf(arm,hand);
}
const hx=rz=>0.265+0.42*Math.sin(rz);  
function gear(r,teeth,mat){
  const g=new THREE.Group();
  const core=mk(G.cyl(r,r,0.05,teeth*2),mat);core.rotation.x=Math.PI/2;g.add(core);
  for(let i=0;i<teeth;i++){const a=i/teeth*Math.PI*2;const t=mk(G.box(0.045,0.05,0.05),mat,Math.cos(a)*(r+0.02),Math.sin(a)*(r+0.02),0);t.rotation.z=a;g.add(t);}
  const hub=mk(G.cyl(r*0.3,r*0.3,0.06,8),M.dark);hub.rotation.x=Math.PI/2;g.add(hub);
  return g;
}
function mortarboard(acc,size=1){
  const g=new THREE.Group();
  g.add(mk(G.cyl(0.13*size,0.145*size,0.07*size,8),M.dark,0,0,0));
  const b=mk(G.box(0.34*size,0.022*size,0.34*size),acc,0,0.045*size,0);b.rotation.y=Math.PI/4;g.add(b);
  g.add(mk(G.sph(0.02*size,5,4),acc,0,0.06*size,0));
  const tas=new THREE.Group();tas.position.set(0.17*size,0.05*size,0);
  tas.add(mk(G.cyl(0.006,0.006,0.12*size,4),M.paper,0,-0.06*size,0));
  tas.add(mk(G.sph(0.014,5,4),M.paper,0,-0.125*size,0));
  g.add(tas);g.userData.tassel=tas;
  return g;
}
 
const KITS={
'lider-personas'(ch){
  const cape=mk(new THREE.CylinderGeometry(0.235,0.36,0.78,10,1,true,Math.PI/2,Math.PI),ch.accDS,0,0.5,0);ch.bob.add(cape);
  const scarf=mk(G.tor(0.165,0.05,6,14),ch.acc,0,0.93,0);scarf.rotation.x=Math.PI/2;ch.bob.add(scarf);
  const tail=mk(G.box(0.07,0.22,0.03),ch.acc,0.09,0.8,0.2);tail.rotation.z=0.15;ch.bob.add(tail);
  const h=hold(ch,'L',-1.2,0.22);
  const board=new THREE.Group();board.position.set(0.1,0.08,0.06);board.rotation.x=-0.9;h.add(board);
  board.add(mk(G.box(0.3,0.24,0.02),M.dark));
  const on=ch.accGlow, off=M.steel, dots=[];
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){const d=mk(G.sph(0.021,6,4),off,-0.09+c*0.06,0.06-r*0.06,0.016);board.add(d);dots.push(d);}
  return t=>{
    const lit=Math.floor(t*1.1)%(dots.length+2);
    dots.forEach((d,i)=>{d.material=i<lit?on:off;});
    cape.rotation.x=Math.sin(t*1.1)*0.04;
    tail.rotation.z=0.15+Math.sin(t*1.3)*0.08;
  };
},
cracks(ch){
  const hL=hold(ch,'L',-1.15,0.12);
  const stack=new THREE.Group();stack.position.set(0.03,0.04,0.02);hL.add(stack);
  for(let i=0;i<4;i++){const e=mk(G.box(0.26,0.032,0.18),M.paper,0,i*0.036,0);e.rotation.y=i%2?0.08:-0.06;stack.add(e);}
  stack.add(mk(G.box(0.07,0.01,0.05),ch.acc,0,0.13,0));
  const hR=hold(ch,'R',-0.2);
  const inHand=new THREE.Group();inHand.add(mk(G.box(0.2,0.03,0.14),M.paper));inHand.add(mk(G.box(0.06,0.01,0.04),ch.acc,0,0.02,0));hR.add(inHand);
  const fly=inHand.clone();ch.bob.add(fly);
  return t=>{
    const P=3.4,p=((t+ch.phase)%P)/P;let a;
    if(p<0.28)a=lerp(-0.2,0.75,ease(p/0.28));
    else if(p<0.38)a=lerp(0.75,-1.8,ease((p-0.28)/0.1));
    else if(p<0.7)a=lerp(-1.8,-0.2,ease((p-0.38)/0.32));
    else a=-0.2;
    ch.armR.rotation.x=a;
    inHand.visible=p<0.36||p>0.72;
    const s=(p-0.36)/0.5;fly.visible=s>0&&s<1;
    if(fly.visible){fly.position.set(0.32+0.1*s,1.05+1.0*s-1.4*s*s,0.35+1.1*s);fly.rotation.set(s*2.5,s*4,0);fly.scale.setScalar(1-0.8*s);}
  };
},
seguimiento(ch){
  ch.armR.rotation.set(-2.8,0,-0.3);
  const h=holderOf(ch.armR,ch.handR);
  const phone=new THREE.Group();phone.position.set(-0.03,0.05,-0.04);h.add(phone);
  phone.add(mk(G.box(0.05,0.2,0.1),M.dark));
  phone.add(mk(G.box(0.054,0.15,0.07),ch.acc,0.002,0,0));
  const dots=[];for(let i=0;i<3;i++){const d=mk(G.sph(0.03,6,4),ch.acc,-0.3-i*0.09,1.36+i*0.06,0.05);ch.bob.add(d);dots.push(d);}
  return t=>{
    ch.headG.rotation.x=Math.sin(t*1.7)*0.07;ch.headG.rotation.z=-0.12;
    ch.armL.rotation.x=-0.35+Math.sin(t*1.3)*0.25;
    dots.forEach((d,i)=>d.scale.setScalar(0.35+0.65*Math.max(0,Math.sin(t*2.4-i*0.9))));
  };
},
registro(ch){

  $('c-does').textContent=e.does;
  $('c-wrong').textContent=e.atn?(e.atn.estado==='arreglado'?'Fixed — '+e.atn.que+(e.atn.extra?' Proves itself '+when(e.atn.extra)+'.':''):e.atn.que+' — '+e.atn.extra):'';
  show('c-wrong',!!e.atn);
  $('c-asks').textContent=e.asks;
  $('c-when').textContent=e.when;
  $('c-where').textContent=e.where;
  $('c-wait').textContent=e.wait?e.wait+' row'+(e.wait>1?'s':'')+' waiting for your mark':''; show('c-wait',!e.isOrch&&e.wait);
  $('c-runs').innerHTML=(e.runs||[]).map(r=>`<li>${esc(r)}</li>`).join(''); $('c-runsk').style.display=(!e.isOrch&&(e.runs||[]).length)?'':'none'; $('c-runs').parentNode.style.display=$('c-runsk').style.display;
  const st=$('c-status');
  if(e.status==='failing'){st.className='chip bad';st.textContent=e.atn&&e.atn.estado==='arreglado'?'Last run failed — fix in place':'Not working — last run failed';}
  else{st.className='chip ok';st.textContent=e.live?'Ready when you start it':'Working';}
  $('c-trust').innerHTML=e.isOrch?trustHtml(AGENTS.filter(a=>a.orch===o.key).map(a=>a.id),'Its agents',Object.keys(OKEY).find(k=>OKEY[k]===o.key)):trustHtml([e.id]);
  $('c-last').textContent=e.isOrch?'':(e.last||'—'); $('c-lastk').style.display=e.isOrch||!e.last?'none':''; $('c-last').style.display=$('c-lastk').style.display;
  const acts=e.isOrch?[['Change its goal',ASK.goal(o)]]:[['Change it',ASK.change(e)],['Retire it',ASK.retire(e)]];
  if(!e.isOrch&&e.status==='failing'&&!e.atn) acts.unshift(['Ask the Architect to fix it',ASK.broken(e)]);
  if(!e.isOrch&&e.atn&&e.atn.estado==='necesita-a-pablo') acts.unshift(['Give your input',ASK.input(e.id,e.atn)]);
  $('c-acts').innerHTML=acts.map((a,i)=>`<button class="act${i===0&&acts.length>2?' amber':''}" data-i="${i}">${esc(a[0])} ↗</button>`).join('')+
    '<div style="color:var(--muted);font-size:10px;margin-top:6px">Opens a Claude chat with the Architect, already written. Nothing changes until you say yes there.</div>';
  $('c-acts').querySelectorAll('button').forEach(b=>b.onclick=()=>claude(acts[+b.dataset.i][1]));
  card.classList.add('open');
  selected=ch;ch.root.add(selRing);selRing.visible=true;
}
window.openAgent=id=>{ const ch=chars.find(c=>c.entity.id===id); if(ch) openCard(ch); };  
function closeCard(){card.classList.remove('open');selected=null;selRing.visible=false;if(selRing.parent)selRing.parent.remove(selRing);}
const tmpV=new THREE.Vector3();
function toScreen(v){
  const p=v.clone().project(camera);
  return {x:(p.x+1)/2*canvas.clientWidth,y:(1-p.y)/2*canvas.clientHeight,ok:p.z<1};
}
 
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(!dragging){
    const k=Math.pow(0.9,dt*60);theta+=velT;elev=clamp(elev+velE,0.28,1.12);velT*=k;velE*=k;
    const idle=!STILL&&t-lastInteract>3.5;
    autoSpeed=lerp(autoSpeed,idle?0.045:0,Math.min(1,dt*0.8));
    theta+=autoSpeed*dt;
  }
  zoom=lerp(zoom,zoomTarget,Math.min(1,dt*6));
  const dist=fitDist*zoom;
  camera.position.set(target.x+dist*Math.cos(elev)*Math.sin(theta),target.y+dist*Math.sin(elev),target.z+dist*Math.cos(elev)*Math.cos(theta));
  camera.lookAt(target);
  scene.fog.near=dist*0.85;scene.fog.far=dist*2.1;
  
  islands.forEach(is=>{
    is.group.position.y=is.baseY+Math.sin(t*0.35+is.phase)*0.13;
    is.flagG.rotation.y=Math.sin(t*1.1+is.phase)*0.22;
  });
  links.forEach(l=>{const u=((t*l.speed)+l.off)%1;l.curve.getPoint(u,l.dot.position);l.dot.scale.setScalar(l.failing?0.8:Math.sin(u*Math.PI)*0.9+0.2);});
  if(typeof dust!=='undefined')dust.rotation.y=t*0.01;
  
  chars.forEach(ch=>{
    ch.time+=dt*(ch.failing?0.35:1);
    const ct=ch.time;
    ch.bob.position.y=ch.baseY+Math.sin(ct*1.6+ch.phase)*0.02;
    if(ch.update)ch.update(ct);
    if(ch.light){ch.lightMat.opacity=0.7+0.3*Math.sin(t*2+ch.phase);ch.light.position.y=ch.topY+Math.sin(t*1.5+ch.phase)*0.02;}
    if(ch.ring){const p=(t*0.8+ch.phase)%1;ch.ring.scale.setScalar(1+p*0.45);ch.ringMat.opacity=0.6*(1-p);}
    if(ch.bang){ch.bang.position.y=ch.topY+0.14+Math.sin(t*2.2+ch.phase)*0.04;ch.bang.rotation.y=t*0.6;}
    const want=(ch===hovered?1.07:1)*ch.scale;
    ch.root.scale.setScalar(lerp(ch.root.scale.x,want,Math.min(1,dt*10)));
  });
  if(selRing.visible)selRing.material.opacity=0.45+0.25*Math.sin(t*2.4);
  renderer.render(scene,camera);
  
  hovered=(pointerIn&&!dragging)?castAt():null;
  canvas.classList.toggle('pointing',!!hovered&&!dragging);
  if(hovered){
    hovered.root.getWorldPosition(tmpV);tmpV.y+=(hovered.topY+0.45)*hovered.scale;
    const s=toScreen(tmpV);
    hoverEl.style.display='block';hoverEl.style.left=s.x+'px';hoverEl.style.top=(s.y-6)+'px';
    const e=hovered.entity;
    hoverEl.innerHTML=`<span style="color:${e.status==='failing'?'#FF5A5A':ORCH[e.orch].color}">${esc(e.isOrch?(ORCH[e.orch].name+' lead'):(e.name||e.id))}</span><span class="r">${e.isOrch?'orchestrator':esc(e.id)}</span>`;
  } else hoverEl.style.display='none';
  islands.forEach(is=>{
    is.flagG.getWorldPosition(tmpV);tmpV.y+=0.55;
    const s=toScreen(tmpV);
    is.lab.style.display=s.ok?'block':'none';
    is.lab.style.left=s.x+'px';is.lab.style.top=s.y+'px';
  });
  nameLabels.forEach(n=>{ n.ch.root.getWorldPosition(tmpV); const s=toScreen(tmpV);
    n.el.style.display=s.ok?'block':'none'; n.el.style.left=s.x+'px'; n.el.style.top=s.y+'px'; });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
fetch('/api/datos',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  CONF=d.confianza||CONF; AG=Object.assign(AG,d.agentes||{});
  (AG.orquestadores||[]).forEach(o=>{ const v=ORCHESTRATORS.find(x=>x.key===OKEY[o.clave]); if(v){ v.name=o.nombre; v.goal=o.meta; } });
  const tr=Object.fromEntries((d.trabajos||[]).map(t=>[t.slug,t])), ATN=(AG.atencion||{}).filas||{};
  TOOLS=(AG.agentes||[]).filter(a=>a.tipo==='herramienta');
  AGENTS=(AG.agentes||[]).filter(a=>a.tipo==='trabajo'||a.tipo==='en-vivo').map(a=>{
    const t=tr[a.id]||{}, next=en(t.proxima_corrida_texto), last=en(t.ultima_corrida_texto), live=a.tipo==='en-vivo';
    return {id:a.id, name:a.nombre||a.id, role:live?'You start it':'Runs on its own', does:a.hace||'—', asks:a.pide||'—', note:a.nota||'',
      part:a.su_parte||'', orch:OKEY[a.orquestador]||'outside', live, runs:a.corridas||[], atn:ATN[a.id]||null,
      wait:(t.pendientes||[]).length, status:t.color==='rojo'?'failing':'working',
      when:live&&!t.slug?'When you start it':next?'Next run '+next:(t.etiqueta?en(t.etiqueta):'—'),
      where:t.corre_en==='nube'?'In the cloud (3:00, with the Mac closed)':(t.corre_en==='mac'||t.corre_en==='local')?'On the Mac':live?'Wherever you open it':'—',
      last:t.slug?(last?last+' · ':'')+String(t.mensaje||'').replace(/^FALLO:\s*/,'').slice(0,240):'',
      mensaje:String(t.mensaje||'').replace(/^FALLO:\s*/,'')}; });
  startWorld(); needs(); drawer();
}).catch(e=>{ document.getElementById('header').textContent="Couldn't read your agents ("+e.message+")"; });
 
function claude(prompt){ fetch('/api/correlo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})})
  .then(x=>x.json()).then(j=>{ if(!j.ok) alert(j.error||"Couldn't open Claude — the prompt is copied, paste it in a chat."); })
  .catch(()=>alert("Couldn't reach the panel")); }
const ASK={
  input:(a,x)=>`/arquitecto ${a} needs my input. What the morning pass found: "${x.que}" The question: ${x.extra}\n\nMy answer: `,
  broken:a=>`/arquitecto ${a.id} (${a.name}) is not working and nobody has explained why yet. Its last run says: "${a.mensaje}". Find the cause and fix it; if it needs my input, ask me in plain words.`,
  orphan:(id,q)=>`/arquitecto ${id}: ${q} It belongs in: `,
  change:a=>`/arquitecto change ${a.id} (${a.name}): `,
  retire:a=>`/arquitecto retire ${a.id} (${a.name}). Why: `,
  goal:o=>`/arquitecto change the goal of the ${o.name} orchestrator. In my words: `,
};
function needs(){
  const rows=[], A=Object.fromEntries(AGENTS.map(a=>[a.id,a]));
  AGENTS.filter(a=>a.atn&&a.atn.estado==='necesita-a-pablo').forEach(a=>rows.push({c:'pablo',k:'Needs your input',a,q:a.atn.que,m:a.atn.extra,b:`<button class="act amber" data-p="input" data-id="${esc(a.id)}">Give your input ↗</button>`}));
  (AG.problemas||[]).filter(p=>p.quien==='pablo').forEach(p=>rows.push({c:'pablo',k:'Needs your input',a:A[p.id]||{id:p.id,name:p.id},q:p.que,b:`<button class="act amber" data-p="orphan" data-id="${esc(p.id)}" data-q="${esc(p.que)}">Tell the Architect ↗</button>`}));
  AGENTS.filter(a=>a.status==='failing'&&!a.atn).forEach(a=>rows.push({c:'bad',k:'Not working · not explained yet',a,q:a.mensaje.slice(0,260),b:`<button class="act" data-p="broken" data-id="${esc(a.id)}">Ask the Architect to fix it ↗</button>`}));
  AGENTS.filter(a=>a.atn&&a.atn.estado==='arreglado').forEach(a=>rows.push({c:'ok',k:'Fixed · '+(a.atn.extra?'proves itself '+when(a.atn.extra):'proving itself'),a,q:a.atn.que}));
  (AG.problemas||[]).filter(p=>p.quien!=='pablo').forEach(p=>rows.push({c:'ok',k:'The morning pass fixes it',a:A[p.id]||{id:p.id,name:p.id},q:p.que}));
  const el=document.getElementById('needs'); if(!rows.length){ el.className=''; return; }
  const mine=rows.filter(r=>r.c==='pablo').length, bad=rows.filter(r=>r.c==='bad').length;
  el.innerHTML=`<h3><span>${mine?`<span style="color:var(--amber)">${mine} need${mine>1?'':'s'} you</span>`:'Nothing needs you'}${bad?` · <span style="color:var(--red)">${bad} not explained</span>`:''} · ${rows.length-mine-bad} being fixed</span><span id="n-min">–</span></h3>`+
    rows.map(r=>`<div class="row ${r.c}"><b data-open="${esc(r.a.id)}">${esc(r.a.name||r.a.id)}</b><span class="k">${esc(r.k)}</span><div class="q">${esc(r.q)}</div>${r.m?`<div class="m">${esc(r.m)}</div>`:''}${r.b||''}</div>`).join('')+
    (rows.length-mine-bad?`<button class="more" id="n-more">Show the ${rows.length-mine-bad} being fixed ▸</button>`:'');
  el.className='on';
  const mb=document.getElementById('n-more'); if(mb) mb.onclick=()=>{ el.classList.toggle('fixed'); mb.textContent=(el.classList.contains('fixed')?'Hide':'Show')+` the ${rows.length-mine-bad} being fixed `+(el.classList.contains('fixed')?'▾':'▸'); };
  el.querySelector('h3').onclick=()=>{ el.classList.toggle('min'); document.getElementById('n-min').textContent=el.classList.contains('min')?'+':'–'; };
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.openAgent&&window.openAgent(b.dataset.open));
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const a=A[b.dataset.id];
    claude(b.dataset.p==='input'?ASK.input(b.dataset.id,a.atn):b.dataset.p==='broken'?ASK.broken(a):ASK.orphan(b.dataset.id,b.dataset.q)); });
}
function when(s){ const d=new Date(s); return isNaN(d)?s:d.toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}); }
function drawer(){
  const H=AG.historia||[], tabs=document.getElementById('d-tabs'), body=document.getElementById('d-body'), dr=document.getElementById('drawer');
  let tab='h';
  const draw=()=>{
    tabs.innerHTML=`<span class="${tab==='h'?'on':''}" data-t="h">History · ${H.length}</span><span class="${tab==='t'?'on':''}" data-t="t">Tools you call · ${TOOLS.length}</span>`+
      `<span class="latest">${H[0]?esc(H[0].fecha+' · '+H[0].que):''}</span><span>${dr.classList.contains('open')?'▾':'▴'}</span>`;
    body.innerHTML=tab==='h'?H.map(h=>`<div class="h"><span class="d">${esc(h.fecha)}</span><span class="t ${esc(h.tipo)}">${esc(h.tipo)}</span><span>${esc(h.que)}</span></div>`).join('')
      :TOOLS.map(x=>`<div class="tool"><span>${esc(x.nombre)}</span><span class="m">${esc(x.hace)}</span><span>${esc(x.pide)}</span></div>`).join('');
    tabs.querySelectorAll('[data-t]').forEach(s=>s.onclick=e=>{ e.stopPropagation(); tab=s.dataset.t; dr.classList.add('open'); draw(); });
  };
  tabs.onclick=()=>{ dr.classList.toggle('open'); draw(); };
  draw();
}
